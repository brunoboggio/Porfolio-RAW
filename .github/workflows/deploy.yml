name: Deploy Antigravity to Banahosting

on:
  push:
    branches:
      - main  # Se ejecutará cuando subas cambios a la rama main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout del código
        uses: actions/checkout@v3

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # O la versión que uses

      - name: 📦 Instalar dependencias y Build
        run: |
          npm install
          npm run build  # Aquí se genera la carpeta de salida (ej: dist o build)

      - name: 🚀 Subir archivos al Hosting via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" ${{ secrets.FTP_SERVER }} <<EOF
          set ftp:passive-mode yes
          set ssl:verify-certificate no
          mirror --reverse --delete --verbose ./dist/ /public_html/
          quit
          EOF
