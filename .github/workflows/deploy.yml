name: Deploy Antigravity to Banahosting

on:
  push:
    branches:
      - main  # Se ejecutará cuando subas cambios a la rama main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout del código
        uses: actions/checkout@v3

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # O la versión que uses

      - name: 📦 Instalar dependencias y Build
        run: |
          npm install
          npm run build  # Aquí se genera la carpeta de salida (ej: dist o build)

      - name: 🚀 Subir archivos al Hosting via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Cambia 'dist' por el nombre de tu carpeta de salida
          local-dir: ./dist/
          # Cambia '/' por la ruta en el servidor si es necesario
          server-dir: ./
